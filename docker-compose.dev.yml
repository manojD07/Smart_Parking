version: '3.8'

name: smart-parking-dev

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: smart_parking_db_dev
    environment:
      - POSTGRES_DB=smart_parking
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./backend/database_dumps/final_DB_dump.sql:/docker-entrypoint-initdb.d/01-final_DB_dump.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart_parking_dev_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: smart_parking_redis_dev
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart_parking_dev_network

  # Database Migration & Seeding (Init Container)
  db_init:
    build: ./backend
    container_name: smart_parking_init_dev
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/smart_parking
      - DATABASE_URL_SYNC=postgresql://postgres:password@db:5432/smart_parking
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      - ENVIRONMENT=development
      - DEBUG=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - smart_parking_dev_network
    command: >
      sh -c "
        echo '🔄 Starting database initialization...' &&
        echo '📋 Running Alembic migrations...' &&
        alembic upgrade head &&
        echo '🌱 Seeding comprehensive sample data...' &&
        python scripts/seed_comprehensive_data.py &&
        echo '✅ Database initialization complete!'
      "

  # FastAPI Backend (Development mode with hot reload)
  api:
    build: ./backend
    container_name: smart_parking_api_dev
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/smart_parking
      - DATABASE_URL_SYNC=postgresql://postgres:password@db:5432/smart_parking
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      - ENVIRONMENT=development
      - DEBUG=true
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      db_init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    networks:
      - smart_parking_dev_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker
  celery_worker:
    build: ./backend
    container_name: smart_parking_worker_dev
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/smart_parking
      - DATABASE_URL_SYNC=postgresql://postgres:password@db:5432/smart_parking
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      - ENVIRONMENT=development
      - DEBUG=true
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - smart_parking_dev_network
    command: celery -A app.tasks.celery_app worker --loglevel=info

  # Celery Beat (Scheduler)
  celery_beat:
    build: ./backend
    container_name: smart_parking_scheduler_dev
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/smart_parking
      - DATABASE_URL_SYNC=postgresql://postgres:password@db:5432/smart_parking
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      - ENVIRONMENT=development
      - DEBUG=true
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - smart_parking_dev_network
    command: celery -A app.tasks.celery_app beat --loglevel=info

  # Celery Flower (Monitoring)
  celery_flower:
    image: mher/flower:2.0
    container_name: smart_parking_monitor_dev
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - FLOWER_PORT=5555
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - smart_parking_dev_network
    command: celery --broker=redis://redis:6379/1 flower --port=5555

volumes:
  postgres_data_dev:
  redis_data_dev:

networks:
  smart_parking_dev_network:
    driver: bridge
